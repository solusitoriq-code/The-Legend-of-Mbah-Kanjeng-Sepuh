<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="volcanoGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.4"/>

  <!-- Smoke puffs -->
  <circle cx="256" cy="140" r="45" fill="#94a3b8" opacity="0.6"/>
  <circle cx="210" cy="110" r="35" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="295" cy="100" r="40" fill="#e2e8f0" opacity="0.8"/>
  <circle cx="256" cy="80" r="30" fill="#f8fafc" opacity="0.9"/>

  <!-- Magma burst -->
  <polygon points="256,150 240,210 272,210" fill="url(#lavaGrad)" filter="url(#glow)"/>
  <circle cx="230" cy="140" r="8" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="275" cy="130" r="10" fill="#f97316" filter="url(#glow)"/>
  <circle cx="256" cy="115" r="7" fill="#fef08a" filter="url(#glow)"/>

  <!-- Volcano Body -->
  <polygon points="120,400 220,210 292,210 392,400" fill="url(#volcanoGrad)"/>
  
  <!-- Volcano Crater -->
  <ellipse cx="256" cy="210" rx="36" ry="12" fill="#ef4444" filter="url(#glow)"/>

  <!-- Lava river down mountain -->
  <path d="M250,218 Q240,270 260,310 T245,400" stroke="#f59e0b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M265,220 Q280,265 270,330 T285,400" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Book / Education Symbol -->
  <g transform="translate(146, 360)">
    <path d="M110,40 C60,20 10,25 0,35 L0,85 C10,75 60,70 110,90 C160,70 210,75 220,85 L220,35 C210,25 160,20 110,40 Z" fill="#ffffff" filter="url(#glow)"/>
    <path d="M110,40 L110,90" stroke="#cbd5e1" stroke-width="4"/>
  </g>

  <!-- Interactive Sparkles -->
  <polygon points="400,160 408,180 428,188 408,196 400,216 392,196 372,188 392,180" fill="#facc15" filter="url(#glow)"/>
  <polygon points="100,260 105,275 120,280 105,285 100,300 95,285 80,280 95,275" fill="#facc15" filter="url(#glow)"/>
</svg>
